experience:
  - role: Software Engineer Intern
    org: Wellington Management
    start: 2026-06-01
    end: 2026-08-01
    summary: |
      - Reverse-engineered a legacy Order Management System spanning 30 relational database tables and mapped its hierarchical rules architecture.
      - Developed a ReactJS/SQL interface for visualizing, configuring, and auditing trade-routing logic.
      - Built tooling that enabled quantitative execution teams to configure and backtest routing changes without direct software-engineering intervention, replacing a four-week DBR-based process.
      - Built order audit-trail functionality to trace decisions between automated low-touch execution and high-touch trader workflows.
  - role: Undergraduate Econometrics Researcher
    org: Honors Thesis, University of South Florida
    start: 2025-08-01
    summary: |
      - Developed an end-to-end causal inference study of nuclear power plants, local tax revenue, and school spending across 52 plants and 103,270 school districts.
      - Designed stacked event studies around plant construction and operation using geographically matched controls.
      - Estimated post-construction property-tax gains of approximately $7,000 per pupil in host districts and $2,300 per pupil at the county level.
  - role: Graph Machine Learning Researcher
    org: Connected Social Artificial Intelligence Lab, University of South Florida
    start: 2025-08-01
    summary: |
      - Lead an undergraduate team developing graph- and LLM-based methods for synthetic electronic health record generation.
      - Developed EHR-Walk, a random-walk algorithm for generating synthetic patient data from heterogeneous EHR graphs.
      - Developed baseline graph transfer-learning models and theoretical analysis of computation-graph approaches to embedding differentiation.
  - role: Lead Graph Machine Learning Researcher
    org: NSF REU, James Madison University
    start: 2025-05-01
    end: 2026-04-01
    summary: |
      - Developed ReCYCLE Net, a feature-free, unsupervised Graph Neural Network for community detection using RNBRW cycle information and graph attention.
      - Evaluated the model on social, citation, and biological networks up to 56,944 nodes, achieving 0.344 ONMI on overlapping protein-complex detection.
      - First-authored the resulting paper published at the GRaM Workshop at ICLR 2026.
  - role: Machine Learning and Spatial Researcher
    org: Dr. Ran Tao's Spatial and Transportation Lab, Wuhan University
    start: 2024-10-01
    end: 2026-04-01
    summary: |
      - Built a geospatial machine-learning pipeline across 1,048,576 National Highway System road segments and 83,507 census tracts.
      - Developed a LightGBM hurdle model that achieved 0.919 AUC for growth classification and R² = 0.77 for growth magnitude.
      - Developed a Python spatial-accessibility model for county-level public EV charging access across the United States.
  - role: Computer Vision Researcher and Data Developer
    org: Secure & Intelligent Systems Lab, University of South Florida
    start: 2024-05-01
    end: 2025-08-01
    summary: |
      - Developed the Unreal Engine 5 procedural content generation implementation for SegGen, an automated multimodal semantic-segmentation dataset pipeline.
      - Contributed to a published pipeline producing aligned RGB, depth, and pixel-level ground-truth labels.
  - role: Software Developer Intern
    org: Gravic Inc.
    start: 2024-05-01
    end: 2024-08-01
    summary: |
      - Saved more than $20,000 annually by developing C# and VBA libraries to replace Syncfusion dependencies in automated Excel reporting workflows.
      - Built .NET libraries with ClosedXML and OpenXML to generate Excel reports through C# and VBA applications.

