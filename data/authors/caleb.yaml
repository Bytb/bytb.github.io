bio: |
  I am a 2026 Barry Goldwater Scholar, Sigma Xi inductee, and machine learning researcher at
  the University of South Florida, where I maintain a 4.0 GPA while pursuing dual BS degrees
  in Computer Science and Econometrics and Quantitative Economics with a minor in Geographic
  Information Systems. My research sits at the intersection of machine learning, causal
  inference, and data science for actionable insights. I have
  first-authored work published at the GRaM Workshop at ICLR 2026 and received the Gulf Coast
  Undergraduate Research Symposium Award in Economics while collaborating with faculty worldwide across disciplines. 


